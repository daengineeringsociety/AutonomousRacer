services:
  ros_dev:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/deepracer_project:cached
      - ~/.gitconfig:/home/daes/.gitconfig:ro
      - /sys/class/pwm:sys/class/pwm
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=42
    network_mode: host
    # ports:
    #   # Force bind to all Mac interfaces explicitly 
    #   - "8765:8765/udp"
    #   - "0.0.0.0:8765:8765/udp"
    privileged: true
    command: sleep infinity
    user: daes
